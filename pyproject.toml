[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vesper"
version = "0.2.0.dev0"
description = "VESPER: real smart-home devices as virtual twins, for research in Habitat homes"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "json5>=0.9",
  "jsonschema>=4.23",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
vesper = "vesper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["vesper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits real upstream sources (opt-in: VESPER_NETWORK_TESTS=1)"]

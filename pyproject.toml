[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vesper-studio"  # the command and the import name stay `vesper` (PyPI's `vesper` is another project)
version = "0.2.0.dev0"
description = "VESPER Studio: real smart-home devices as virtual twins, in homes from real 3D scenes, with Home Assistant"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "astral>=2.2,<3",  # the sun, as Home Assistant computes it (astral 2.2)
  "jinja2>=3.1.6",  # the automation engine's Home Assistant templates, in its sandbox (fixed escapes below 3.1.6)
  "httpx>=0.27",
  "json5>=0.9",
  "jsonschema>=4.23",
  "mcp>=2.3,<3",
  "paho-mqtt>=2.1",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "websockets>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
validation = ["pvlib>=0.11,<0.14"]  # `vesper validate sun`: NREL's Solar Position Algorithm as the reference
gallery = ["pillow>=10", "numpy"]  # the plan gallery: thumbnails (else the image itself), ground truth (numpy)
scan = ["trimesh>=4", "numpy", "scipy>=1.10", "usd-core>=24"]  # `vesper lab import` of scans and 3D models (USDZ, glb, obj, ply)

[project.scripts]
vesper = "vesper.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["vesper", "vesper_world"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: hits real upstream sources (opt-in: VESPER_NETWORK_TESTS=1)",
  "stack: starts a real Mosquitto on a free local port (opt-in: VESPER_STACK_TESTS=1)",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pinned: newer ruff releases enable far more rules by default, so an unpinned "ruff clean" drifts.
select = ["E4", "E7", "E9", "E501", "F"]
